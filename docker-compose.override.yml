services:
  postgres:
    image: postgres:16-alpine
    container_name: nessie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
      POSTGRES_DB: nessie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - nessie_pg_data:/var/lib/postgresql/data
    networks:
      - nessie-internal

  nessie:
    environment:
      NESSIE_DB_HOST: postgres
      NESSIE_DB_USER: nessie
      NESSIE_DB_PASS: nessie
      NESSIE_DB_NAME: nessie
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nessie_pg_data:
